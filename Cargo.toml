[workspace]
resolver = "2"
members = [
    "crates/simonides-core",
    "crates/simonides-crypto",
    "crates/simonides-sync",
    "crates/simonides",
    "crates/simonides-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
authors = ["Matthew Attenborough", "Minerva"]
license = "AGPL-3.0-only"
description = "Simonides: an encrypted, local-first memory palace for AI agents, served over MCP."

[workspace.dependencies]
# Async (sync crate's store contract)
tokio = { version = "1.38", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Errors, time, logging, ids
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
uuid = { version = "1.10", features = ["v4", "serde"] }

# Crypto
rand = "0.8"
sha2 = "0.10"
argon2 = "0.5"
chacha20poly1305 = "0.10"
hkdf = "0.12"
zeroize = "1.7"
hex = "0.4"

# Embeddings (local ONNX inference for vector retrieval)
fastembed = "5"

# Storage: SQLCipher (encrypted SQLite), vendored so no system OpenSSL is needed.
rusqlite = { version = "0.39.0", features = ["bundled-sqlcipher-vendored-openssl"] }

# Tests
tempfile = "3"

# Config files (tier policy)
toml = "0.8"

# Platform data directory (first-run home)
dirs = "6"

# Internal crates
simonides-core = { path = "crates/simonides-core" }
simonides-crypto = { path = "crates/simonides-crypto" }
simonides-sync = { path = "crates/simonides-sync" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1